<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER // Scholar Nexus</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/pages/scanner.css">
</head>

<body>

    <!-- Header -->
    <div id="app-header"></div>

    <div class="container">
        <div class="scanner-layout">
            <!--  Search Panel -->
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-user-scan" style="color:var(--accent)"></i> TARGET SCAN</h2>

                <div class="form-group">
                    <label>TARGET RESEARCHER</label>
                    <input type="text" id="q" placeholder="Enter author name..."
                        onkeypress="if(event.key==='Enter') search()">
                </div>

                <div class="form-group">
                    <label>MISSION PARAMETERS (OPTIONAL)</label>
                    <textarea id="desc"
                        placeholder="Describe the specific topic, technology, or niche you are evaluating this expert for..."></textarea>
                </div>

                <button class="btn-action" onclick="search()">
                    INITIATE SCAN <i class="fas fa-satellite-dish"></i>
                </button>

                <!-- Results List -->
                <div id="results-list" class="results-list"></div>
                <!-- Pagination -->
                <div id="pagination"></div>
            </div>

            <!--(Main View) -->
            <div class="main-view" id="main-view">
                <div
                    style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 50px 20px;">
                    <div
                        style="background: var(--bg-card); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                        <i class="fas fa-fingerprint" style="font-size: 3rem; color: var(--accent); opacity: 0.8;"></i>
                    </div>
                    <h2 style="font-family: var(--font-header); color: var(--text-main); margin: 0 0 10px 0;">RESEARCHER
                        SCANNER</h2>
                    <p style="max-width: 400px; line-height: 1.6; margin: 0;">Search for a researcher on the left to
                        analyze their publications, network, and relevance to your specific topic. <strong>click search then select a researcher to view their details.</strong></p>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div id="app-footer"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/pagination.js"></script>
    <script src="/js/search-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/pages/scanner.js"></script>
</body>

</html>
