<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPER EXPLORER // Scholar Nexus</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/pages/explorer.css">
</head>

<body>

    <div id="app-header"></div> <!-- Assumed existing layout -->

    <div class="container">
        <div class="explorer-layout">

            <!-- CONTROLS -->
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-book-reader" style="color:var(--accent)"></i> Paper Explorer
                </h2>

                <div class="form-group">
                    <label>SEARCH QUERY OR ABSTRACT</label>
                    <textarea id="q-input"
                        placeholder="Enter keywords, a research question, or paste an abstract..."></textarea>
                </div>

                <div class="form-group">
                    <label>PAPER ID (FOR SIMILARITY)</label>
                    <input type="text" id="q-id" placeholder="Optional: Paste S2 Paper ID to find similar">
                </div>

                <div class="form-group">
                    <label>YEAR FILTER</label>
                    <input type="number" id="f-year" placeholder="e.g. 2023">
                </div>

                <button class="btn-action" onclick="fetchPapers('search')">
                    SEARCH PAPERS <i class="fas fa-search"></i>
                </button>

                <div style="text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                    Powered by <strong style="color:var(--text-main)">Semantic Scholar</strong>
                </div>
            </div>

            <!-- RESULTS -->
            <div class="main-view" id="main-view">
                <div class="searchResults" id="searchResult">
                    <div
                        style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 2rem;">
                        <div
                            style="background: var(--bg-card); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid var(--border);">
                            <i class="fas fa-layer-group" style="font-size: 3rem; color: var(--accent); opacity: 0.8;"></i>
                        </div>
                        <h2>Start Your Discovery</h2>
                        <p>Enter a topic to find papers, or use "Find Similar" on results to explore the network.</p>
                    </div>
                </div>
                <div id="pagination"></div>
            </div>

        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/Pagination.js"></script>
    <script src="/js/search-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/pages/explorer.js"></script>
</body>

</html>
